# Canonicalization triggers a second lookup pass; Match exec runs in both.
Host *
    CanonicalizeHostname yes
    CanonicalDomains lab.test corp.test
    CanonicalizeFallbackLocal yes

Match exec "probe-exec --stage pass1 --host %n"
    User first-pass-user

Host www.canon-target
    Match exec "probe-exec --stage pass2 --host %n"
    User canonical-user
